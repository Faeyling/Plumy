<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Pink background -->
  <circle cx="16" cy="16" r="16" fill="#fce7f3"/>

  <!-- Fan: 5 feathers, pivot (11, 21) -->
  <line x1="11" y1="21" x2="16" y2="10" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="21" x2="11" y2="9"  stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="21" x2="6"  y2="10" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="21" x2="3"  y2="14" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="11" y1="21" x2="2"  y2="19" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eye spots -->
  <circle cx="16" cy="10" r="2.2" fill="#166534"/>
  <circle cx="16" cy="10" r="1.5" fill="#f59e0b"/>
  <circle cx="16" cy="10" r="0.8" fill="#1d6eb0"/>

  <circle cx="11" cy="9"  r="2.2" fill="#15803d"/>
  <circle cx="11" cy="9"  r="1.5" fill="#f59e0b"/>
  <circle cx="11" cy="9"  r="0.8" fill="#1d6eb0"/>

  <circle cx="6"  cy="10" r="2.2" fill="#166534"/>
  <circle cx="6"  cy="10" r="1.5" fill="#f59e0b"/>
  <circle cx="6"  cy="10" r="0.8" fill="#1d6eb0"/>

  <circle cx="3"  cy="14" r="1.9" fill="#15803d"/>
  <circle cx="3"  cy="14" r="1.3" fill="#f59e0b"/>
  <circle cx="3"  cy="14" r="0.7" fill="#1d6eb0"/>

  <circle cx="2"  cy="19" r="1.9" fill="#166534"/>
  <circle cx="2"  cy="19" r="1.3" fill="#f59e0b"/>
  <circle cx="2"  cy="19" r="0.7" fill="#1d6eb0"/>

  <!-- Body -->
  <ellipse cx="18" cy="22" rx="6" ry="7" fill="#1a6fb5"/>
  <ellipse cx="20" cy="24" rx="3.5" ry="5" fill="#4a9fd4" opacity="0.65"/>

  <!-- Neck -->
  <path d="M 18.5 17 Q 22 14 24 12" stroke="#1a6fb5" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Head -->
  <circle cx="25" cy="11" r="4.5" fill="#1a6fb5"/>
  <circle cx="23" cy="9"  r="3" fill="#4a9fd4" opacity="0.35"/>

  <!-- Eye -->
  <circle cx="28" cy="10" r="1.8" fill="white"/>
  <circle cx="28.4" cy="9.6" r="1.1" fill="#1e1b4b"/>
  <circle cx="28.9" cy="9.2" r="0.4" fill="white"/>

  <!-- Beak -->
  <path d="M 29 11 L 31.5 9.5 L 29 13 Z" fill="#f97316"/>

  <!-- Aigrette: 3 stems + poms (well within circle, y ≥ 5) -->
  <line x1="23" y1="7"  x2="22" y2="5"  stroke="#bfdbfe" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="25" y1="6.5" x2="25" y2="4.5" stroke="#bfdbfe" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="27" y1="7"  x2="28" y2="5"  stroke="#bfdbfe" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="22" cy="4.5" r="1.3" fill="#f472b6"/>
  <circle cx="25" cy="3.8" r="1.4" fill="#a78bfa"/>
  <circle cx="28" cy="4.5" r="1.3" fill="#34d399"/>
</svg>
